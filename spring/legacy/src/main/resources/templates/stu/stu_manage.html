<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <select onchange="getStuList()" id="classSelector">
    <option value="0">전체</option>
    <option
      th:each="cls : ${classList}"
      th:value="${cls.classNum}"
      th:text="${cls.className}"
      th:selected="${cls.classNum == selectedClassNum}">
    </option>
  </select>

  <br>

  <table border="1">
    <thead>
      <tr>
        <td>No</td>
        <td>학번</td>
        <td>이름</td>
        <td>학년</td>
        <td>학급번호</td>
        <td>학급명</td>
      </tr>
    </thead>
    <tbody>
      <tr th:each="stu, stat: ${stuList}">
        <td>[[${stat.count}]]</td>
        <td>[[${stu.stuNum}]]</td>
        <td>[[${stu.stuName}]]</td>
        <td>[[${stu.stuYear}]]</td>
        <td>[[${stu.classNum}]]</td>
        <td>[[${stu.className}]]</td>
      </tr>
    </tbody>
  </table>

  <script src="/js/stu_manage.js"></script>
</body>
</html>
